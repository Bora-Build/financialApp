name: Deploy SelfMoney to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financialapp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install and validate
        run: |
          npm ci
          npm run lint
      - name: Build for the subdomain
        env:
          VITE_APP_BASE_PATH: /
          VITE_API_URL: ''
        run: |
          npm run build
          mkdir -p release/public
          cp -a dist/. release/public/
          cp FinancialApp.js package.json package-lock.json release/
          cp -a backend release/backend
          rm -rf release/backend/node_modules
          tar -czf "$GITHUB_SHA.tar.gz" -C release .
      - name: Configure exclusive deployment SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload and deploy only FinancialApp
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$VPS_USER" == financialapp-deploy ]]
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$VPS_PORT" "$GITHUB_SHA.tar.gz" "$VPS_USER@$VPS_HOST:/srv/financialapp/incoming/$GITHUB_SHA.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "/srv/financialapp/bin/release $GITHUB_SHA"
      - name: Remove runner SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
